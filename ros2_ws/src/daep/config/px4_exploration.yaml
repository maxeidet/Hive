/**:
  ros__parameters:

    # PX4 x500 with the OakD-Lite depth camera (gz_x500_depth), flown through Hive's DAEP bridge.
    # Based on granso_exploration.yaml (M100). The map comes from Hive's octomap_server
    # (swarm_backend/mapping.py: 0.1 m voxels, 8 m range), so the octomap values below
    # must match its arguments. Launch: daep_exploration.launch.py in Hive's swarm_backend.
    
    # Camera field of view and sensor range
    camera/horizontal_fov: 73.0 # degrees, the whole FOV (OakD-Lite depth: 1.274 rad)
    camera/vertical_fov: 58.0   # degrees, the whole FOV (640x480 image)
    
    # Raycasting
    raycast/dr: 0.1   #Must be the same as octomap resolution
    raycast/dphi: 10.0  
    raycast/dtheta: 10.0 
    
    # System (Robot) parameters
    husky: false #Set to true if using Husky A201
    system/bbx/use_sphere_collision_checking: true # If true, use sphere collision checking, if false, use bounding box
    system/bbx/r: 0.4  # Bounding radius for collision checking: x500 with propellers is about 0.35 m
    system/bbx/x: 0.7 # Not used with sphere collision checking
    system/bbx/y: 0.7
    system/bbx/z: 0.3

    # AEP Gain Computation
    aep/gain/r_min: 0.1 #Start distance for gain computation
    aep/gain/r_max: 8.0 #End distance for gain computation (the range mapping.py gives octomap_server)
    aep/gain/inside_boundary: true # Only unknown space inside boundary/min..max gives gain (outdoors: no walls)
  
    # If false, use regular octomap for collision checking
    # If true, copy octomap, remove ground from copy and use for collision checking. Let the other one remain for mapping and viz.
    # We filter out voxels that are below robot_z - ground_filter_z_dist, so we use the robot as base.
    filter_out_ground: false
    viz_filtered_octomap: false # If true, visualize the filtered octomap
    ground_filter_z_dist: 0.2 #m (Spot Max Step Height 0.3m) Must be >= 0
    wall_height: 3.0 # ONLY USED IN TELEPORT SIMULATION

    # Octomap parameters
    resolution: 0.1 #Octomap resolution - Make sure this is the same as raycast/dr
    use_smoothing: true
    smoothing_factor: 0.1 # Between 0 and 1, Lower value means more smoothing

    # Note that start cylinder collision checking is currently disabled in the code
    ignore_first_iteration: true # If true, ignore first collision check since the turtlebot might not have determined all voxels around it
    
    sensor_model:
      min_range: 0.1
      max_range: 8.0
      min: 0.12
      max: 0.97
      miss: 0.4
      hit: 0.7

    aep/gain/zero: 20.0 #NOT USED
    aep/gain/lambda: 0.0  # Used in dynamic score to tune how much we care about distance to node
    aep/gain/sigma_thresh: 0.2  # Used in GP, only use GP estimate if variance (sigma) is below this threshold
    daep/dfm/zeta: 0.0  # Used to tune how much we DFM
    
    # -- Sampling and Normalization
    z_offset: 0.0  #NOT USED
    aep/tree/extension_range: 1.0  # Extension of RRT (We always normalize to this)
    aep/tree/max_sampling_radius: 10.0  # Maximum sampling radius around the robot
    
    # -- First check (gain enough coverage)
    aep/tree/initial_iterations: 15  # Sample AT LEAST these many VALID (static and dynamic collision-checked) nodes
    daep/rrt/max_sampled_initial_nodes: 90  # Sample maximum this many nodes initially (Has passed static collision checking. Agnostic to dynamic collision checking.)

    # -- Second check (gain enough gain)
    daep/rrt/max_sampled_nodes: 170  # Sample maximum this many nodes in total (Has passed static collision checking. Agnostic to dynamic collision checking.)
    aep/tree/cutoff_iterations: 30  # Currently not used

    # DAEP parameters
    daep/gain/cache_node_threshold: 50 # In reevaluate, only keep cached nodes with a gain above this threshold
    daep/gain/node_gain_threshold: 40  # Only insert cached nodes with a gain above this threshold
    
  # Tune threshold to add to the frontier and what nodes to reevaluate (add to and extract from frontier) (threshold = max * ratio)
    add_to_frontier_ratio: 0.2
    reeval_ratio: 0.2
    zero_gain_ratio: 0.05
    best_branch_threshold: 1.9 #New branch must be at least <best_branch_threshold> percent better to be chosen, otherwise stick to old branch
    time_window: 3.0 # How much time before and after reaching node in the RRT-tree, where it still has to be collision-free from dynamic obstacles.

    # Kalman Filter parameters
    daep/kf/iterations: 150  # How many steps forward in time
    daep/kf/process_noise: 0.001 #(meter/time^2)^2 (Related to maximum expected acceleration in system, in our case not applied since we accerlate with infinite acceleration when turning...)
    daep/kf/measurement_noise: 0.0049 #meter^2 (Variance in position obvervation, format is (uncertainty)^2)
    daep/kf/position_uncertainty: 0.1 #ONLY USED FOR INITALIZATION
    daep/kf/velocity_uncertainty: 0.1 #ONLY USED FOR INITALIZATION
    daep/kf/time_step: 0.1  # (NOT USED, COMPUTED in aeplanner.cpp) Step size in time. Change in animate_objects.py
    daep/kf/safety_iteration: 0
    human_measurement_timeout: 5.0
    prediction_mode: 'linear' # 'circle', linear', 'kalman'

    # Boundary boost
    boosted_boundary_length: 0.0  # If point within this threshold from boundary, boost it with boost_magnitude (see below)
    boost_magnitude: 0.0
    
    # RRT* parameters (Global planner)
    rrt/min_nodes: 100  # Sample at least these many nodes in RRT*
    rrt/extension_range: 1.0
    rrt/location_tolerance: 1.5

    # Global planning
    global_planner_counter: 25  # Number of times we re-do the global planning
    coverage_threshold: 95.0  # percent of the boundary box mapped; stop there (0 = off)
    coverage_stall_rounds: 50  # also stop when coverage grew less than coverage_stall_gain
    coverage_stall_gain: 1.5  # percentage points over coverage_stall_rounds rounds (0 rounds = off)
    look_ahead_horizon: 5  # Look ahead horizon for the safe path check
    
    # Emergency avoidance
    max_avoidance_counter: 15  # Number of times we do emergency avoidance [SHOULD NOT BE USED]
    
    # Toggle features
    drone_freeze: false  # Disable PublishGoalAndWait
    visualizeDFM: false
    visualize_static_and_dynamic_rays: false
    visualize_rays: false  # NOT USED
    visualize_tree: true  # NOT USED
    visualize_exploration_area: true  # Visualize world bounding box and frustum (NOT USED; ALWAYS TRUE)
    visualize_predictions: true # If many dynamic obstacles, set this to false to gain performance (at least in visulization)
    debug_text : false
    add_rejected_nodes: false # Add nodes that are in dynamic collision to RRT-tree to continue expansion. However, we cannot actually travel to these nodes.

    # Dynamic Obstacle parameters (Human if use_sphere_collision_checking = false, drone if use_sphere_collision_checking = true)
    period_time: 0.1 #Update interval for dynamic position
    num_obstacles: 5 #Number of dynamic obstacles to spawn in

    # Human parameters  
    human_height: 1.8
    human_width: 1.0
    human_linear_velocity: 0.05 #m/s (Human preferred walking speed), Should be 10% of drone_linear_velocity = 0.031 m/s, regular human walking speed 1.42 m/s
    human_angular_velocity: 1.0

    # UAV-obstacle parameters (Used for dynamic obstacles)
    flying_obstacle_diameter : 0.7 #meter, Bounding Sphere diameter (M100 diameter = 650mm)
    flying_obstacle_linear_velocity: 0.05
    
    # Drone parameters (Used for the DAEP-agent)
    drone_height: 0.1 #NOT USED, see System/bbx/z
    drone_width: 0.4  #NOT USSED, see System/bbx/x
    drone_linear_velocity: 1.0 #m/s, px4_bridge.py --lead 1 flies at about this speed
    drone_angular_velocity: 1.0 #rad/s
    rotating_while_walking: true # If true, the robot can rotate while walking (spot can do this), impacts time estimation


    # World parameters
    #boundary/volume: 500.0 No longer used, automatically computed from boundary/min and boundary/max
    # The box to explore, world frame (ENU, metres). hive_base: around the start point and the
    # campfire, above the ground. Fixed for now; later set from a centre point and a radius.
    boundary/min: [ -6.0, -2.0, 0.5]
    boundary/max: [ 6.0, 10.0, 3.0]
    
    # Frames
    robot_frame: "base_link"
    world_frame: "world"
