# unbind default prefix and set it to ctrl-o

unbind C-b
set -g prefix C-o
bind C-o send-prefix

# make delay shorter
set -sg escape-time 0

# scroll with mouse
#set -g mouse off

bind-key q kill-session
bind-key Q kill-server

# " windowlist -b
unbind '"'
bind '"' choose-window

# quit \ 
unbind '\'
bind '\' confirm-before "kill-server"



