<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive Operator</title>
<style>
  /* One dark theme: green for the search area, amber for cautions, red for the hostile. */
  :root {
    color-scheme: dark;
    --bg: #0d1113; --panel: #13191c; --line: #263238; --text: #dbe4e0; --muted: #7d8f88;
    --grid: rgba(150, 190, 170, 0.14); --area: #4cc38a; --area-fill: rgba(76, 195, 138, 0.07);
    --ok: #4cc38a; --warn: #e5a83a; --bad: #f05a4f;
    --handle: #0d1113;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .clock { color: var(--muted); font: 12px var(--mono); }
  .link { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.ok { background: var(--ok); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; flex: 1; min-height: 0; }
  #mapWrap { position: relative; min-height: 360px; min-width: 0; }
  /* Absolute, so the canvas's own pixel size never stretches the grid. */
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .legend {
    position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 10px;
  }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 10px; font-weight: 600; }
  .field { display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field[hidden] { display: none; }
  .field label { color: var(--muted); font-size: 13px; }
  input[type=range] { accent-color: var(--ok); }
  .field input[type=number] {
    width: 100%; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--text); font: inherit; font-variant-numeric: tabular-nums;
  }
  .buttons { display: flex; gap: 8px; align-items: center; margin: 12px 0 4px; }
  button {
    font: inherit; padding: 5px 12px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--ok); border-color: var(--ok); color: var(--bg); font-weight: 600; }
  button:disabled { opacity: .35; cursor: default; }
  .note { font-size: 12px; color: var(--muted); min-height: 1.4em; }
  .note.err { color: var(--bad); }
  .cards { display: grid; gap: 10px; }
  .card {
    position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid;
    grid-template-columns: 1fr 96px; gap: 8px; overflow: hidden;
  }
  .card::before {  /* a bright edge on the left, in the track's colour */
    content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; background: var(--edge, var(--line));
  }
  .card.hostile { border-color: rgba(255, 59, 48, .45); }
  .card.stale { opacity: .45; }
  .card h3 { margin: 0 0 4px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; white-space: nowrap; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .card.hostile .swatch { transform: rotate(45deg) scale(.85); }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  .badge.armed { color: var(--ok); border-color: var(--ok); }
  .badge.task { color: var(--bg); border-color: transparent; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .dial { width: 96px; height: 96px; }
  @media (max-width: 760px) {
    body { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); }
    #mapWrap { height: 60vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Hive operator</h1>
  <span class="clock" id="clock">--:--:--Z</span>
  <div class="link"><span class="dot" id="linkDot"></span><span id="linkText">connecting…</span></div>
</header>
<main>
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div class="legend">Drag the sector's middle to turn and resize it, its ends to widen it. North is up.</div>
  </div>
  <aside>
    <h2>Search sector</h2>
    <div class="field"><label for="heading">Bearing</label><input id="headingR" type="range" min="0" max="359" step="1"><input id="heading" type="number" min="0" max="359" step="1"></div>
    <div class="field"><label for="width">Width</label><input id="widthR" type="range" min="10" max="180" step="1"><input id="width" type="number" min="10" max="180" step="1"></div>
    <div class="field"><label for="radius">Range</label><input id="radiusR" type="range" min="10" max="1000" step="5"><input id="radius" type="number" min="10" max="5000" step="5"></div>
    <div class="buttons">
      <button class="primary" id="apply" disabled>Apply</button>
      <button id="revert" disabled>Revert</button>
    </div>
    <div class="note" id="note"></div>
    <div class="field" id="mapField" hidden><label for="mapAlpha">Map</label><input id="mapAlpha" type="range" min="0" max="100" step="5" value="70"><span class="note" id="mapWorld"></span></div>
    <h2 style="margin-top:18px">Drones</h2>
    <div class="cards" id="cards"></div>
  </aside>
</main>
<script>
(() => {
  const POLL_MS = 200;
  const STALE_S = 2.0;          // no PX4 message for this long: drone shown greyed out
  const TRAIL_S = 15;           // gimbal heading history shown
  const CAMERA_HFOV_DEG = 114.6; // gz_x500_gimbal: 2.0 rad (detect/camera.py)
  const TARGET_TRAIL_S = 20;    // where the attack saw the target, shown this long
  const VELOCITY_LEAD_S = 2;    // the commanded velocity arrow: where the drone is in 2 s
  const COLORS = ['#39d0ff', '#5ce1e6', '#6fa8ff', '#9ef0ff', '#4fb8ff', '#a8c8ff'];  // friendlies: blues, as in NATO symbols
  const FONT = '11px system-ui, -apple-system, sans-serif', FONT_B = '600 ' + FONT;
  // Attack states (intercept/attack.py) and the colour each one's badge gets.
  const STATUS_COLORS = { searching: '--area', intercept: '--bad', 'target lost': '--warn', hit: '--ok' };  // others: --muted

  const $ = id => document.getElementById(id);
  const canvas = $('map'), ctx = canvas.getContext('2d');
  let server = null;   // last /api/state
  let draft = null;    // search area being edited, not yet applied
  let drag = null;     // 'mid' | 'edge'
  const trails = {};   // drone id -> [{t, h}] gimbal heading history
  const targetTrails = {};  // drone id -> [{t, n, e}] target as the attack saw it
  let mapImg = null, mapVersion = null;  // background picture from map_snapshot.py
  let view = { cx: 0, cy: 0, scale: 1 };

  const tokens = {};  // one theme, so the CSS tokens can be read once
  const css = name => tokens[name] || (tokens[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim());
  const wrap = a => ((a + 180) % 360 + 360) % 360 - 180;
  const rad = d => d * Math.PI / 180;
  const color = id => COLORS[id % COLORS.length];
  const trackColor = d => d.hostile ? css('--bad') : color(d.id);
  const callsign = d => (d.hostile ? 'Hostile ' : 'Drone ') + d.id;
  const area = () => draft || (server && server.search_area);
  const fmt = (v, unit = '', digits = 0) => v == null ? '–' : v.toFixed(digits) + unit;

  // World NED (north, east) <-> canvas pixels, north up.
  const toPx = (n, e) => [view.cx + e * view.scale, view.cy - n * view.scale];
  const toWorld = (x, y) => [(view.cy - y) / view.scale, (x - view.cx) / view.scale];
  const bearing = (n, e, c) => (Math.atan2(e - c[1], n - c[0]) * 180 / Math.PI + 360) % 360;

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function fitView() {
    const r = canvas.getBoundingClientRect(), a = area();
    if (!a) return;
    let reach = a.radius_m * 1.15;
    for (const d of server.drones) {
      if (d.north != null) reach = Math.max(reach, 1.1 * Math.hypot(d.north - a.centre[0], d.east - a.centre[1]));
    }
    // Keep the scale while dragging, so the handle stays under the pointer.
    if (!drag) view.scale = Math.min(r.width, r.height) / 2 / reach;
    [view.cx, view.cy] = [r.width / 2 - a.centre[1] * view.scale, r.height / 2 + a.centre[0] * view.scale];
  }

  function niceStep(span) {
    const p = Math.pow(10, Math.floor(Math.log10(span)));
    return [1, 2, 5, 10].map(m => m * p).find(s => span / s <= 5);
  }

  function arcHandles(a) {
    const at = (h, r) => toPx(a.centre[0] + r * Math.cos(rad(h)), a.centre[1] + r * Math.sin(rad(h)));
    return {
      mid: at(a.heading_deg, a.radius_m),
      left: at(a.heading_deg - a.width_deg / 2, a.radius_m),
      right: at(a.heading_deg + a.width_deg / 2, a.radius_m),
    };
  }

  function draw() {
    const r = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);
    if (!server) return;
    fitView();
    const a = area(), [bx, by] = toPx(a.centre[0], a.centre[1]);

    ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, r.width, r.height);
    drawMap();
    ctx.font = FONT; ctx.textBaseline = 'alphabetic';

    // Fine grid, range rings and the bearing ring.
    const reach = Math.hypot(r.width, r.height) / view.scale;
    const step = niceStep(reach / 2);
    ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
    ctx.globalAlpha = 1; ctx.fillStyle = css('--muted');
    for (let d = step; d < reach; d += step) {
      ctx.beginPath(); ctx.arc(bx, by, d * view.scale, 0, 2 * Math.PI); ctx.stroke();
      ctx.fillText(d + ' m', bx + 4, by - d * view.scale - 3);
    }
    const R = Math.min(r.width, r.height) / 2 - 18;
    ctx.strokeStyle = css('--grid'); ctx.beginPath(); ctx.arc(bx, by, R, 0, 2 * Math.PI); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let b = 0; b < 360; b += 10) {
      const len = b % 30 === 0 ? 8 : 4, s = Math.sin(rad(b)), c = -Math.cos(rad(b));
      ctx.beginPath(); ctx.moveTo(bx + R * s, by + R * c); ctx.lineTo(bx + (R - len) * s, by + (R - len) * c); ctx.stroke();
      if (b % 30 === 0) ctx.fillText(String(b).padStart(3, '0'), bx + (R - 20) * s, by + (R - 20) * c);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

    const now = performance.now() / 1000;

    // Search area: canvas angle 0 is east; heading 0 is north (up).
    const a0 = rad(a.heading_deg - a.width_deg / 2 - 90), a1 = rad(a.heading_deg + a.width_deg / 2 - 90);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, a.radius_m * view.scale, a0, a1); ctx.closePath();
    ctx.fillStyle = css('--area-fill'); ctx.fill();
    ctx.strokeStyle = css('--area'); ctx.lineWidth = 1.5;
    ctx.setLineDash(draft ? [6, 4] : []); ctx.stroke(); ctx.setLineDash([]);
    const hs = arcHandles(a);
    for (const [x, y] of [hs.mid, hs.left, hs.right]) {
      ctx.fillStyle = css('--handle'); ctx.fillRect(x - 5, y - 5, 10, 10);
      ctx.strokeStyle = css('--area'); ctx.lineWidth = 1.5; ctx.strokeRect(x - 5, y - 5, 10, 10);
    }

    // Base: a square with a cross, like a ground unit.
    ctx.strokeStyle = css('--text'); ctx.lineWidth = 1.5; ctx.strokeRect(bx - 6, by - 6, 12, 12);
    ctx.beginPath(); ctx.moveTo(bx - 6, by - 6); ctx.lineTo(bx + 6, by + 6); ctx.moveTo(bx + 6, by - 6); ctx.lineTo(bx - 6, by + 6); ctx.stroke();
    ctx.fillStyle = css('--text'); ctx.fillText('base', bx + 10, by + 16);

    // Drones: camera field of view, gimbal sweep trail, body, detection.
    const fovLen = Math.min(r.width, r.height) * 0.18;
    for (const d of server.drones) {
      if (d.north == null) continue;
      const [x, y] = toPx(d.north, d.east), c = trackColor(d), stale = d.age_s == null || d.age_s > STALE_S;
      ctx.globalAlpha = stale ? 0.35 : 1;
      for (const p of trails[d.id] || []) {
        const age = now - p.t;
        ctx.strokeStyle = c; ctx.globalAlpha = (stale ? 0.35 : 1) * 0.35 * (1 - age / TRAIL_S);
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.lineTo(x + fovLen * 1.3 * Math.sin(rad(p.h)), y - fovLen * 1.3 * Math.cos(rad(p.h))); ctx.stroke();
      }
      ctx.globalAlpha = stale ? 0.35 : 1;
      if (d.gimbal_heading_deg != null) {
        const g = d.gimbal_heading_deg;
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.arc(x, y, fovLen, rad(g - CAMERA_HFOV_DEG / 2 - 90), rad(g + CAMERA_HFOV_DEG / 2 - 90)); ctx.closePath();
        ctx.fillStyle = c; ctx.globalAlpha *= 0.12; ctx.fill(); ctx.globalAlpha = stale ? 0.35 : 1;
        ctx.strokeStyle = c; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + fovLen * 1.3 * Math.sin(rad(g)), y - fovLen * 1.3 * Math.cos(rad(g))); ctx.stroke();
      }
      if (d.attack) drawAttack(d, x, y, c, now);
      drawSymbol(d, x, y, c);
      // Friendly labels to the right, hostile ones to the left, so they do not pile up
      // when the two close in.
      const name = callsign(d), side = d.hostile ? -1 : 1, lx = x + side * 16;
      const status = d.status && !d.hostile ? ' ' + d.status : '';
      ctx.textAlign = d.hostile ? 'right' : 'left'; ctx.font = FONT_B;
      const nameW = ctx.measureText(name).width, statusW = ctx.measureText(status).width;
      const x0 = d.hostile ? lx - nameW - statusW : lx;
      ctx.textAlign = 'left'; ctx.fillStyle = c; ctx.fillText(name, x0, y - 6);
      if (status) { ctx.fillStyle = css(STATUS_COLORS[d.status] || '--muted'); ctx.fillText(status, x0 + nameW, y - 6); }
      ctx.font = FONT; ctx.fillStyle = css('--muted'); ctx.textAlign = d.hostile ? 'right' : 'left';
      ctx.fillText(`${fmt(d.altitude, ' m')} · ${fmt(d.speed, ' m/s', 1)}`, lx, y + 8);
      ctx.textAlign = 'left';
      if (d.detection) {
        const [tx, ty] = toPx(d.detection.north, d.detection.east);
        ctx.strokeStyle = css('--bad'); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = css('--bad'); ctx.beginPath(); ctx.arc(tx, ty, 2.5, 0, 2 * Math.PI); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    drawNorth(r);
  }

  // Friendly: a chevron in a circle, pointing where it flies. Hostile: a red diamond
  // (as in NATO symbols) with a heading tick.
  function drawSymbol(d, x, y, c) {
    ctx.save(); ctx.translate(x, y); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 1.5;
    if (d.hostile) {
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(10, 0); ctx.lineTo(0, 10); ctx.lineTo(-10, 0); ctx.closePath(); ctx.stroke();
      ctx.globalAlpha *= 0.25; ctx.fill(); ctx.globalAlpha /= 0.25;
      if (d.heading_deg != null && d.speed > 0.3) {
        ctx.rotate(rad(d.heading_deg)); ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, -22); ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, 2 * Math.PI); ctx.stroke();
      ctx.rotate(rad(d.heading_deg || 0));
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(5.5, 6); ctx.lineTo(0, 3); ctx.lineTo(-5.5, 6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // The world from above, under everything else, faded by the Map slider and darkened a
  // little so the lines on top stay readable.
  function drawMap() {
    const m = server.map, alpha = $('mapAlpha').value / 100;
    if (!mapImg || !m || alpha === 0) return;
    const [x0, y0] = toPx(m.north_max, m.east_min), [x1, y1] = toPx(m.north_min, m.east_max);
    ctx.globalAlpha = alpha; ctx.drawImage(mapImg, x0, y0, x1 - x0, y1 - y0);
    ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(13, 17, 19, 0.3)'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  }

  function syncMap() {
    const m = server.map;
    $('mapField').hidden = !m;
    if (!m) { mapImg = null; mapVersion = null; return; }
    $('mapWorld').textContent = m.world || '';
    if (m.version === mapVersion) return;
    mapVersion = m.version;
    const img = new Image();
    img.onload = () => { mapImg = img; draw(); };
    img.src = '/map.png?v=' + m.version;
  }
  $('mapAlpha').addEventListener('input', () => draw());

  // North arrow, top right.
  function drawNorth(r) {
    ctx.fillStyle = css('--area'); ctx.font = FONT_B; ctx.textAlign = 'center';
    ctx.beginPath(); ctx.moveTo(r.width - 30, 18); ctx.lineTo(r.width - 36, 32); ctx.lineTo(r.width - 24, 32); ctx.closePath(); ctx.fill();
    ctx.fillText('N', r.width - 30, 46); ctx.textAlign = 'left'; ctx.font = FONT;
  }

  // What the attack node is doing: the target's track, where it was last seen once the
  // camera lost it, the velocity the pursuit commands, and range / time to impact.
  function drawAttack(d, x, y, c, now) {
    const a = d.attack, bad = css('--bad'), alpha = ctx.globalAlpha;
    for (const p of targetTrails[d.id] || []) {
      const [px, py] = toPx(p.n, p.e);
      ctx.globalAlpha = alpha * 0.6 * (1 - (now - p.t) / TARGET_TRAIL_S); ctx.fillStyle = bad;
      ctx.beginPath(); ctx.arc(px, py, 2, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.globalAlpha = alpha;
    if (a.velocity) {
      const vn = a.velocity.north * VELOCITY_LEAD_S, ve = a.velocity.east * VELOCITY_LEAD_S;
      const len = Math.hypot(vn, ve) * view.scale;
      if (len > 4) {
        const ang = Math.atan2(ve, vn), ex = x + len * Math.sin(ang), ey = y - len * Math.cos(ang);
        ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
        ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(5, 3); ctx.lineTo(-5, 3); ctx.closePath(); ctx.fill(); ctx.restore();
      }
    }
    if (!a.target) return;
    const [tx, ty] = toPx(a.target.north, a.target.east);
    // Seen now: a box round it. Not seen: a dashed amber box where it was.
    const locked = !!d.detection, col = locked ? bad : css('--warn'), k = 13, b = 5;
    ctx.save(); ctx.translate(tx, ty); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    if (!locked) ctx.setLineDash([2, 2]);
    ctx.beginPath();
    for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
      ctx.moveTo(sx * k, sy * (k - b)); ctx.lineTo(sx * k, sy * k); ctx.lineTo(sx * (k - b), sy * k);
    }
    ctx.stroke(); ctx.restore();
    const lines = [locked ? 'seen' : (a.seen_s_ago != null ? `last seen ${a.seen_s_ago.toFixed(1)} s ago` : ''),
                   [a.range_m != null ? `${a.range_m.toFixed(0)} m` : null,
                    a.impact_s != null ? `impact in ${a.impact_s.toFixed(1)} s` : null].filter(Boolean).join(' · ')];
    ctx.fillStyle = col; ctx.font = FONT_B; ctx.textAlign = 'center';  // under the box
    ctx.fillText(lines[0], tx, ty + k + 13);
    ctx.font = FONT; ctx.fillText(lines[1], tx, ty + k + 26); ctx.textAlign = 'left';
  }

  // Gimbal dial in a drone card: compass with the search arc, the drone's nose, the
  // gimbal's heading now and where it pointed over the last TRAIL_S seconds.
  function drawDial(cv, d) {
    const dpr = window.devicePixelRatio || 1, s = 96;
    if (cv.width !== s * dpr) { cv.width = cv.height = s * dpr; }
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, s, s);
    const c = s / 2, R = 38, a = area(), now = performance.now() / 1000;
    g.strokeStyle = css('--line'); g.lineWidth = 1; g.beginPath(); g.arc(c, c, R, 0, 2 * Math.PI); g.stroke();
    g.beginPath(); g.moveTo(c, c);
    g.arc(c, c, R, rad(a.heading_deg - a.width_deg / 2 - 90), rad(a.heading_deg + a.width_deg / 2 - 90)); g.closePath();
    g.fillStyle = css('--area-fill'); g.fill();
    g.fillStyle = css('--muted'); g.font = '10px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText('N', c, 9);
    const ray = (h, len) => [c + len * Math.sin(rad(h)), c - len * Math.cos(rad(h))];
    for (const p of trails[d.id] || []) {
      const [x, y] = ray(p.h, R - 4);
      g.globalAlpha = 0.7 * (1 - (now - p.t) / TRAIL_S); g.fillStyle = color(d.id);
      g.beginPath(); g.arc(x, y, 2, 0, 2 * Math.PI); g.fill();
    }
    g.globalAlpha = 1;
    if (d.heading_deg != null) {
      const [x, y] = ray(d.heading_deg, R + 1);
      g.strokeStyle = css('--muted'); g.lineWidth = 3; g.beginPath(); g.moveTo(...ray(d.heading_deg, R - 7)); g.lineTo(x, y); g.stroke();
    }
    if (d.gimbal_heading_deg != null) {
      g.strokeStyle = color(d.id); g.lineWidth = 2.5; g.beginPath(); g.moveTo(c, c); g.lineTo(...ray(d.gimbal_heading_deg, R - 2)); g.stroke();
    } else {
      g.fillStyle = css('--muted'); g.fillText('no gimbal', c, c + 4);
    }
  }

  // The attack's numbers in a drone card, while it has a target.
  function attackRows(a) {
    if (!a || !a.target) return '';
    const closing = a.closing_mps == null ? '–' : (a.closing_mps < 0 ? 'opening ' : '') + Math.abs(a.closing_mps).toFixed(1) + ' m/s';
    const timeout = a.timeout ? `<dt>${a.timeout.to === 'lost' ? 'Lost in' : 'Search in'}</dt><dd style="color:var(--warn)">${a.timeout.in_s.toFixed(1)} s</dd>` : '';
    return `<dt>Range</dt><dd>${fmt(a.range_m, ' m', 1)}</dd>
      <dt>Closing</dt><dd>${closing}</dd>
      <dt>Impact in</dt><dd>${fmt(a.impact_s, ' s', 1)}</dd>
      <dt>Engaged</dt><dd>${fmt(a.engaged_s, ' s', 0)}</dd>${timeout}`;
  }

  function renderCards() {
    const box = $('cards');
    for (const d of server.drones) {
      let card = box.querySelector(`[data-id="${d.id}"]`);
      if (!card) {
        card = document.createElement('div'); card.className = 'card'; card.dataset.id = d.id;
        card.classList.toggle('hostile', !!d.hostile); card.style.setProperty('--edge', trackColor(d));
        card.innerHTML = `<div><h3><span class="swatch" style="background:${trackColor(d)}"></span>${callsign(d)}
          <span class="badge task"></span><span class="badge conn"></span></h3><dl></dl></div><canvas class="dial"></canvas>`;
        box.appendChild(card);
      }
      const stale = d.age_s == null || d.age_s > STALE_S;
      card.classList.toggle('stale', stale);
      const badge = card.querySelector('.badge.conn');
      badge.textContent = d.armed == null ? 'no link' : (d.armed ? 'armed' : 'disarmed');
      badge.classList.toggle('armed', !!d.armed);
      const task = card.querySelector('.badge.task');
      task.textContent = d.status;
      task.style.background = css(STATUS_COLORS[d.status] || '--muted');
      task.title = d.attack_state ? `Attack node state: ${d.attack_state}` : 'From PX4 (no attack node running)';
      if (d.hostile) { task.textContent = 'hostile'; task.style.background = css('--bad'); task.title = 'The target drone (attack.target_id), from the simulation'; }
      const inArea = d.gimbal_heading_deg != null && Math.abs(wrap(d.gimbal_heading_deg - area().heading_deg)) <= area().width_deg / 2;
      card.querySelector('dl').innerHTML = `
        <dt>Mode</dt><dd>${d.nav_state ? d.nav_state.toLowerCase().replace(/_/g, ' ') : '–'}</dd>
        <dt>Altitude</dt><dd>${fmt(d.altitude, ' m', 1)}</dd>
        <dt>Speed</dt><dd>${fmt(d.speed, ' m/s', 1)}</dd>
        <dt>Gimbal</dt><dd>${fmt(d.gimbal_heading_deg, '°')}${d.gimbal_heading_deg != null ? (inArea ? '' : ' (outside)') : ''}</dd>
        <dt>Pitch</dt><dd>${fmt(d.gimbal_pitch_deg, '°')}</dd>
        <dt>Last msg</dt><dd>${d.age_s == null ? '–' : d.age_s < 1 ? 'now' : d.age_s.toFixed(0) + ' s ago'}</dd>
        ${d.detection ? `<dt>Target</dt><dd style="color:var(--bad)">seen</dd>` : ''}
        ${attackRows(d.attack)}`;
      drawDial(card.querySelector('canvas'), d);
    }
  }

  // Search area form: sliders and number boxes edit the draft; Apply sends it.
  const fields = { heading: 'heading_deg', width: 'width_deg', radius: 'radius_m' };
  function syncForm() {
    const a = area();
    for (const [k, f] of Object.entries(fields)) {
      for (const el of [$(k), $(k + 'R')]) if (document.activeElement !== el) el.value = Math.round(a[f]);
    }
    $('apply').disabled = $('revert').disabled = !draft;
  }
  function editDraft(changes) {
    draft = { ...(draft || server.search_area), ...changes };
    $('note').textContent = 'Not applied yet.'; $('note').className = 'note';
    syncForm(); draw();
  }
  for (const [k, f] of Object.entries(fields)) {
    for (const el of [$(k), $(k + 'R')]) {
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        if (Number.isFinite(v)) editDraft({ [f]: f === 'heading_deg' ? (v % 360 + 360) % 360 : v });
      });
    }
  }
  $('revert').onclick = () => { draft = null; $('note').textContent = ''; syncForm(); draw(); };
  $('apply').onclick = async () => {
    const body = {}; for (const f of Object.values(fields)) body[f] = draft[f];
    try {
      const res = await fetch('/api/search_area', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || res.statusText);
      server.search_area = out; draft = null;
      $('note').textContent = `Applied (revision ${out.revision}).`; $('note').className = 'note';
    } catch (e) {
      $('note').textContent = e.message; $('note').className = 'note err';
    }
    syncForm(); draw();
  };

  // Dragging the arc's handles.
  canvas.addEventListener('pointerdown', ev => {
    if (!server) return;
    const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, hs = arcHandles(area());
    const near = ([hx, hy]) => Math.hypot(hx - x, hy - y) < 14;
    drag = near(hs.mid) ? 'mid' : (near(hs.left) || near(hs.right)) ? 'edge' : null;
    if (drag) canvas.setPointerCapture(ev.pointerId);
  });
  canvas.addEventListener('pointermove', ev => {
    const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    if (!drag) {
      if (server) {
        const hs = arcHandles(area());
        canvas.style.cursor = [hs.mid, hs.left, hs.right].some(([hx, hy]) => Math.hypot(hx - x, hy - y) < 14) ? 'grab' : 'default';
      }
      return;
    }
    const a = area(), [n, e] = toWorld(x, y), b = bearing(n, e, a.centre);
    if (drag === 'mid') {
      const dist = Math.hypot(n - a.centre[0], e - a.centre[1]);
      editDraft({ heading_deg: Math.round(b), radius_m: Math.max(10, Math.min(5000, Math.round(dist / 5) * 5)) });
    } else {
      editDraft({ width_deg: Math.max(10, Math.min(180, Math.round(2 * Math.abs(wrap(b - a.heading_deg))))) });
    }
  });
  const endDrag = () => { if (drag) { drag = null; draw(); } };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      server = await res.json();
      const now = performance.now() / 1000;
      for (const d of server.drones) {
        const t = (trails[d.id] = (trails[d.id] || []).filter(p => now - p.t < TRAIL_S));
        if (d.gimbal_heading_deg != null && d.age_s != null && d.age_s < STALE_S) t.push({ t: now, h: d.gimbal_heading_deg });
        const tt = (targetTrails[d.id] = (targetTrails[d.id] || []).filter(p => now - p.t < TARGET_TRAIL_S));
        const tg = d.attack && d.attack.target, last = tt[tt.length - 1];
        if (tg && d.attack.seen_s_ago < 0.5 && !(last && last.n === tg.north && last.e === tg.east)) tt.push({ t: now, n: tg.north, e: tg.east });
      }
      $('linkDot').classList.add('ok'); $('linkText').textContent = `${server.drones.length} drones`;
      syncMap(); syncForm(); renderCards(); draw();
    } catch (e) {
      $('linkDot').classList.remove('ok'); $('linkText').textContent = 'no connection to the UI node';
    }
    setTimeout(poll, POLL_MS);
  }

  setInterval(() => { $('clock').textContent = new Date().toISOString().slice(11, 19) + 'Z'; }, 500);

  window.addEventListener('resize', resize);
    resize();
  poll();
})();
</script>
</body>
</html>
