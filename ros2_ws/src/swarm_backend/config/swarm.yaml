# Swarm configuration. Each entry under `drones` is one PX4 SITL instance.
#
# Coordinate conventions used by the backend:
#   - spawn_pose is the Gazebo world position [x, y, z] (ENU: x east, y north, z up),
#     the same numbers passed to PX4 as PX4_GZ_MODEL_POSE.
#   - Everything else (targets, formations, positions in code) is the swarm "world" frame:
#     NED (x north, y east, z down) with its origin at the Gazebo world origin.
#     So z = -5.0 means 5 m above the ground.

swarm:
  rate_hz: 10.0             # offboard setpoint stream rate; PX4 needs at least 2 Hz
  takeoff_altitude: 5.0     # metres above ground
  position_tolerance: 0.3   # metres; how close to a target counts as "reached"
  formation_spacing: 4.0    # metres between neighbouring drones in a formation

drones:
  # id is the PX4 instance number (`px4-gazebo -i <id>`).
  # Optional per-drone overrides:
  #   namespace: defaults to "" for instance 0 and "px4_<id>" otherwise (what PX4's rcS sets)
  #   system_id: defaults to id + 1 (PX4 sets MAV_SYS_ID = instance + 1)
  #   model:     PX4_SIM_MODEL used by `mount-backend.sh spawn` (default gz_x500).
  #              Drone 0 is started by docker/start-dev.sh, so its model is set there (-m).
  #              Custom models live in worlds/models/, e.g. gz_x500_lidar_3d (3D lidar).
  - id: 0
    spawn_pose: [0.0, 0.0, 0.0]

  - id: 1
    spawn_pose: [5.0, 0.0, 0.0]
    model: gz_x500_lidar_3d

  - id: 2
    spawn_pose: [0.0, 5.0, 0.0]
    model: gz_x500_gimbal     # the interceptor: its camera can be kept on the target

# Chase / intercept (tests/intercept_test.py, chase() in the shell). The hostile drone flies
# a pattern; a mock base-station radar measures it (range, azimuth, radial velocity, with
# noise); the interceptor flies to the predicted meeting point, then shadows it at
# `standoff` metres, or further while the radar alone cannot place it that well.
intercept:
  interceptor_id: 2
  hostile_id: 0
  altitude: 50.0            # metres, fixed for both drones
  standoff: 10.0            # metres behind the hostile drone while shadowing
  standoff_sigmas: 3.0      # but at least this many sigmas of the position uncertainty
                            # (radar alone at 2 km: about 15 m sigma, so about 45 m)
  capture_margin: 3.0       # intercept is done within standoff + this
  min_separation: 5.0       # never aim closer than this to the estimated position
  max_speed: 10.0           # m/s assumed for the interceptor (PX4 MPC_XY_VEL_MAX is 12)
  track_timeout: 3.0        # seconds without a radar fix before the target is lost
  use_gimbal: true
  radar_topic: /base/radar/hostile
  radar_rate_hz: 2.0
  # Where the base-station radar is (world NED, metres). Its cross-range error grows with
  # distance (1 deg = 35 m at 2 km), so placing it far away virtually gives realistic
  # errors while the drones fly near the origin. [0, 0, 0] = at the Gazebo origin.
  radar_position: [-2000.0, 0.0, 0.0]
  radar_range_std: 3.5            # metres, 1 sigma
  radar_azimuth_std_deg: 1.0
  radar_elevation_std_deg: 2.0    # measured, but unused: the altitude is fixed for now
  radar_radial_velocity_std: 0.5  # m/s along the line of sight
  hostile_pattern: circle   # line, circle, figure8 or random
  hostile_speed: 4.0        # m/s
  pattern_size: 80.0        # metres: line length, circle diameter, figure-8 / random area width
  seed: 0
  # Baseline evaluation (planning report, Interception > Evaluation). The scenarios
  # are in world NED around a base at the origin; `altitude` is the interceptor's.
  hit_radius: 1.5           # metres: interceptor this close to the target = hit
  goal_radius: 100.0        # metres: x, the mission fails once the target is this close to base
  perimeter_radius: 1000.0  # metres: R_p, the interceptor starts on this ring
  interceptor_max_speed: 12.0   # m/s: v_i (PX4 default)
  hostile_altitude_min: 20.0    # metres: h_h, drawn per run
  hostile_altitude_max: 120.0
  camera_fov_deg: 115.0     # x500_gimbal camera
  detect_range: 51.0        # metres: 0.5 m drone at 4 px in 1280 px / 115 deg; runs start here
  detect_bearing_std_deg: 0.5   # noise of the stand-in detector (true position + noise)
  detect_range_std_frac: 0.1
  lock_k: 3                 # lock-on: confirmed in k of every n images ...
  lock_n: 5
  lock_distance: 20.0       # ... within d_lock metres ...
  lock_time: 3.0            # ... for t_lock seconds without a break
  eval_aspects: [0.0, 30.0, 60.0, 90.0]     # degrees: 0 = head-on, 90 = crossing
  eval_speeds: [4.0, 8.0, 12.0, 14.0, 17.0] # m/s: up to and beyond v_i, incl. v_h
  eval_runs: 30             # seeded runs per (aspect, speed)
  eval_timeout: 300.0       # seconds

# Baseline attack (nodes/attack_node.py, `mount-backend.sh attack`): the defender flies into the
# hostile drone with pure pursuit, on the two detection topics only
# (/<ns>/detection/target_position and target_offset, see intercept/detection.py). The fake
# detector (`mount-backend.sh fakedetect`) makes those topics from Gazebo's true positions
# until the camera detector publishes them.
attack:
  attacker_id: 2            # gimbal drone (gz_x500_gimbal)
  target_id: 0              # the hostile drone
  guard_altitude: 20.0      # metres; where the defender hovers while searching
  search_heading_deg: 0.0   # where the hostile comes from (degrees from north)
  search_pitch_deg: 10.0    # gimbal tilted up a little, so the target has sky behind it
  max_speed: 5.0            # m/s, pure pursuit flies at this speed (PX4's limit is 12)
  gimbal_gain: 0.5          # gimbal turns by this share of target_offset on each message
  coast_after: 0.5          # s without a message: ATTACK -> COAST
  lost_after: 1.5           # s more in COAST: -> LOST
  lost_hold: 3.0            # s LOST hovers before going back to SEARCH
  min_altitude: 5.0         # m; never commanded lower (limits on every command)
  max_climb_speed: 3.0      # m/s, PX4 MPC_Z_VEL_MAX_UP
  max_descent_speed: 1.5    # m/s, PX4 MPC_Z_VEL_MAX_DN
  # Fake detector. Errors off = a perfect detector; `fakedetect --realistic` turns on
  # 0.25 s delay, 1 deg and 20 % noise and a 5 m blind zone, like the real one.
  fake_rate_hz: 4.0
  fake_delay: 0.0
  fake_angle_noise_deg: 0.0
  fake_range_noise: 0.0
  fake_blind_range: 0.0
  fake_max_range: 0.0       # 0 = where the target is fake_min_pixels wide (about 51 m)
  fake_min_pixels: 4.0
  fake_confirm_frames: 3
  seed: 0

# Detection evaluation (planning report, Drone Detection Using Sensors > Evaluation).
# Defenders hold a static ring around the base at the origin; a hostile drone and
# birds approach from random directions. A run ends when the hostile reaches the ring.
detect:
  num_defenders: 12         # N on the ring
  perimeter_radius: 1000.0  # metres: R_p
  altitude: 50.0            # metres: h, the defenders' altitude
  camera_hfov: 2.0          # radians: gz_x500_gimbal camera (theta_0), W_0 x H_0
  image_width: 1280
  image_height: 720
  target_size: 0.5          # metres: s
  bird_size: 0.5
  detect_px: 4.0            # p_min: smallest detectable size
  classify_px: 20.0         # pixels needed to classify
  confirm_k: 3              # k consecutive images above tau = a drone
  confidence_threshold: 0.5 # tau
  match_radius_px: 3.0      # a detection is correct within this of the true centre
  frame_rate_hz: 10.0
  scan_dwell: 0.5           # seconds: t_g per camera position
  hostile_speed: 17.0       # m/s: v_h
  hostile_altitude_min: 20.0
  hostile_altitude_max: 120.0
  start_margin: 1000.0      # metres outside the ring where the hostile drone spawns
  num_birds: 3
  bird_speed: 10.0          # m/s
  range_bins: [0.0, 25.0, 50.0, 100.0, 200.0, 400.0, 800.0]  # metres, interval edges
  size_bins_px: [0.0, 2.0, 4.0, 8.0, 20.0, 50.0, 100.0]      # px, interval edges
  eval_runs: 30
  eval_timeout: 300.0       # seconds
