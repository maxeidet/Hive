# The examiner demo with the operator UI and camera views only (no tactical map), from the
# examiner shoot (recording/shoots/examiner.yaml, recorded with --screen). Each scenario: the
# baseline first, then ours (same seed), then ours through its own camera, zoomed on the box.
#   recording/video.sh final --story examiner-ui --preview examiner     then without --preview
title: Hive - a drone swarm that defends its base
subtitle: TDDE19, group 3 - our system against the baseline
take: best
end_card: compare
evidence: data/baseline_eval

scenes:
- caption: The base
  take: overview-1/overview
  from: start + 2
  to: start + 14
  layout: full
  show: [cam:base_orbit]
  speed: 1.5

- caption: The defenders take off and fly out to their places on the arc
  take: birds-1-ours/1
  from: takeoff - 1
  to: takeoff + 47
  layout: side
  show: [ui, wide]
  speed: 3

# --- 1. head-on ----------------------------------------------------------------------------
- card: 1. One hostile, head-on

- caption: Baseline
  take: head-on-1-baseline/1
  from: release
  to: hit + 2
  layout: full
  show: [ui]
  speed: 2
  insights: [seen_at, time_to_hit]

- caption: Improved version - same flight
  take: head-on-1-ours/1
  from: release
  to: hit + 2
  layout: full
  show: [ui]
  speed: 1.5
  insights: [seen_at, time_to_hit]

- caption: Improved version - through the attacking defender's own camera
  take: head-on-1-ours/1
  from: first_sighting - 3
  to: hit + 1
  layout: full
  show: [yolo]

# --- 2. zigzag -----------------------------------------------------------------------------
- card: 2. A zigzagging hostile

- caption: Baseline - it fails, the hostile reaches the base
  take: zigzag-1-baseline/1
  from: release
  to: end
  layout: full
  show: [ui]
  speed: 3
  insights: [seen_at, no_hit]

- caption: Improved version - same flight
  take: zigzag-1-ours/1
  from: release
  to: hit + 2
  layout: full
  show: [ui]
  speed: 1.5
  insights: [seen_at, time_to_hit]

- caption: Improved version - own camera (left), from behind (right)
  take: zigzag-1-ours/1
  from: first_sighting - 3
  to: hit + 1
  layout: side
  show: [yolo, chase]

# --- 3. birds ------------------------------------------------------------------------------
- card: 3. A hostile among birds

- caption: Baseline - the birds come in with the hostile (from behind its defender)
  take: birds-1-baseline/1
  from: release + 8
  to: first_sighting + 25
  layout: full
  show: [chase]
  speed: 1.5
  insights: [seen_at, no_hit]

- caption: Baseline - its own camera swings with its hard turns, and it misses
  take: birds-1-baseline/1
  from: first_sighting - 3
  to: first_sighting + 6
  layout: full
  show: [yolo]

- caption: Improved version - same birds (wide shot)
  take: birds-1-ours/1
  from: release + 8
  to: hit + 2
  layout: full
  show: [wide]
  insights: [seen_at, time_to_hit]

- caption: Improved version - its own camera locks on the drone, not the birds
  take: birds-1-ours/1
  from: first_sighting - 3
  to: hit + 1
  layout: full
  show: [yolo]

# --- 4. two hostiles -----------------------------------------------------------------------
- card: 4. Two hostiles at once

- caption: Baseline - one of two hit
  take: two-hostiles-1-baseline/1
  from: release
  to: release + 60
  layout: full
  show: [ui]
  speed: 3
  insights: [seen_at]

- caption: Improved version - one defender at each hostile (wide shot)
  take: two-hostiles-1-ours/1
  from: first_sighting - 3
  to: hit + 2
  layout: full
  show: [wide]
  speed: 1.5

- caption: First intercept - drone 3's own camera
  take: two-hostiles-1-ours/1
  from: hit_2 - 8
  to: hit_2 + 1
  layout: full
  show: ["yolo:3"]

- caption: Second intercept - drone 1 goes for the other hostile (its own camera)
  take: two-hostiles-1-ours/1
  from: first_sighting_1 - 1
  to: release + 20
  layout: full
  show: ["yolo:1"]

- caption: Second intercept - behind drone 1 (left), own camera (right)
  take: two-hostiles-1-ours/1
  from: release + 20   # the chase camera is behind drone 1 from release + 19.6 s
  to: hit_1 + 2
  layout: side
  show: [chase, "yolo:1"]
